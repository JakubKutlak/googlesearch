<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vyhledávání obrázků pomocí Google.">
  <title>Google Obrázky</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="search-page">
  <header class="topbar">
    <nav aria-label="Hlavní navigace">
      <a href="index.html">Google Search</a>
      <a href="advanced.html">Rozšířené vyhledávání</a>
      <a href="forms.html">Ukázky formulářů</a>
    </nav>
  </header>

  <main class="search-main">
    <a class="wordmark" href="index.html" aria-label="Google, úvodní stránka">
      <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
    </a>
    <p class="page-tag">Obrázky</p>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input type="hidden" name="tbm" value="isch">
      <label class="visually-hidden" for="image-query">Hledat obrázky</label>
      <div class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="image-query" type="search" name="q" autocomplete="off">
      </div>
      <div class="button-row">
        <input class="button" type="submit" value="Hledat obrázky Google">
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <p class="portfolio-link"><a href="https://jakubkutlak.github.io/">Moje portfolio</a></p>
    <nav class="footer-links" aria-label="Validace a zdroje">
      <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fjakubkutlak.github.io%2Fgooglesearch%2Fimages.html">Validovat HTML</a>
      <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjakubkutlak.github.io%2Fgooglesearch%2Fstyles.css&amp;profile=css3&amp;usermedium=all&amp;warning=1">Validovat CSS</a>
      <a href="https://github.com/JakubKutlak/googlesearch/blob/main/citace.md">Citace a zdroje</a>
    </nav>
  </footer>
</body>
</html>
