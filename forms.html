<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ukázka různých typů formulářových prvků HTML.">
  <title>Ukázky formulářů — Hledač</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="forms-page">
  <header class="home-header">
    <a class="home-brand" href="index.html" aria-label="Hledač, úvodní stránka">
      <span class="brand-mark" aria-hidden="true">h.</span>
      <span>hledač</span>
    </a>
    <nav class="home-nav" aria-label="Hlavní navigace">
      <a href="index.html">Hledání</a>
      <a href="images.html">Obrázky</a>
      <a href="advanced.html">Pokročilé hledání</a>
    </nav>
  </header>

  <main class="forms-main">
    <h1>Ukázky formulářových prvků</h1>
    <p class="notice"><strong>Ukázková stránka – formuláře a tlačítka jsou nefunkční a nic neodesílají.</strong></p>

    <form class="demo-form" action="#" onsubmit="return false">
      <fieldset>
        <legend>Textová pole</legend>
        <div class="form-grid">
          <label for="demo-text">Text <input id="demo-text" type="text" placeholder="Napište text"></label>
          <label for="demo-email">E-mail <input id="demo-email" type="email" placeholder="jmeno@example.cz"></label>
          <label for="demo-password">Heslo <input id="demo-password" type="password" placeholder="Zadejte heslo"></label>
          <label for="demo-search">Vyhledávání <input id="demo-search" type="search" placeholder="Hledat"></label>
          <label for="demo-url">Webová adresa <input id="demo-url" type="url" placeholder="https://example.cz"></label>
          <label for="demo-tel">Telefon <input id="demo-tel" type="tel" placeholder="+420 123 456 789"></label>
          <label for="demo-number">Číslo <input id="demo-number" type="number" min="0" max="100" value="10"></label>
          <label for="demo-range">Rozsah <input id="demo-range" type="range" min="0" max="100" value="50"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Datum a soubory</legend>
        <div class="form-grid">
          <label for="demo-date">Datum <input id="demo-date" type="date"></label>
          <label for="demo-time">Čas <input id="demo-time" type="time"></label>
          <label for="demo-datetime">Datum a čas <input id="demo-datetime" type="datetime-local"></label>
          <label for="demo-month">Měsíc <input id="demo-month" type="month"></label>
          <label for="demo-week">Týden <input id="demo-week" type="week"></label>
          <label for="demo-color">Barva <input id="demo-color" type="color" value="#4285f4"></label>
          <label for="demo-file">Soubor <input id="demo-file" type="file"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Výběr a přepínače</legend>
        <label for="demo-select">Vyberte možnost
          <select id="demo-select" name="demo-select">
            <option value="">Zvolte možnost</option>
            <optgroup label="Vyhledávání">
              <option>Web</option>
              <option>Obrázky</option>
            </optgroup>
            <optgroup label="Jiné">
              <option>Video</option>
              <option>Zprávy</option>
            </optgroup>
          </select>
        </label>
        <label for="demo-datalist">Datalist
          <input id="demo-datalist" list="suggestions" placeholder="Začněte psát">
          <datalist id="suggestions">
            <option value="Hledač">
            <option value="HTML">
            <option value="CSS">
          </datalist>
        </label>
        <div class="choice-group">
          <span class="choice-title">Oblíbená barva (checkboxy)</span>
          <label><input type="checkbox" name="color" value="blue"> Modrá</label>
          <label><input type="checkbox" name="color" value="green"> Zelená</label>
          <label><input type="checkbox" name="color" value="red"> Červená</label>
        </div>
        <div class="choice-group">
          <span class="choice-title">Typ účtu (radio)</span>
          <label><input type="radio" name="account" value="personal"> Osobní</label>
          <label><input type="radio" name="account" value="school"> Školní</label>
          <label><input type="radio" name="account" value="work"> Pracovní</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Zpráva a ovládací prvky</legend>
        <label for="demo-message">Textová oblast
          <textarea id="demo-message" rows="5" placeholder="Napište zprávu…"></textarea>
        </label>
        <label for="demo-progress">Průběh
          <progress id="demo-progress" value="65" max="100">65 %</progress>
        </label>
        <label for="demo-meter">Hodnota
          <meter id="demo-meter" min="0" max="100" low="30" high="75" optimum="80" value="72">72/100</meter>
        </label>
        <div class="demo-buttons">
          <input type="submit" value="Odeslat (nefunkční)" disabled>
          <input type="reset" value="Vymazat (nefunkční)" disabled>
          <button type="button" disabled>Ukázkové tlačítko</button>
        </div>
      </fieldset>
    </form>
  </main>

  <footer class="home-footer">
    <nav aria-label="Validace a zdroje">
      <a href="https://validator.w3.org/nu/?level=warning&amp;doc=https%3A%2F%2Fjakubkutlak.github.io%2Fgooglesearch%2Fforms.html"><img src="assets/html-validator.png" alt="Validovat HTML"></a>
      <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjakubkutlak.github.io%2Fgooglesearch%2Fforms.html&amp;profile=css3svg&amp;usermedium=all&amp;warning=1&amp;vextwarning=&amp;lang=cs"><img src="assets/css-validator.png" alt="Validovat CSS"></a>
      <a href="https://github.com/JakubKutlak/googlesearch/blob/main/citace.md">Citace a zdroje</a>
      <a href="https://jakubkutlak.github.io/">Portfolio ↗</a>
    </nav>
  </footer>
</body>
</html>
