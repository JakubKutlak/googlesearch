<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upřesni svůj vyhledávací dotaz.">
  <title>Pokročilé hledání — Hledač</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="advanced-page">
  <header class="home-header">
    <a class="home-brand" href="index.html" aria-label="Hledač, úvodní stránka">
      <span class="brand-mark" aria-hidden="true">h.</span>
      <span>hledač</span>
    </a>
    <nav class="home-nav" aria-label="Hlavní navigace">
      <a href="index.html">Hledání</a>
      <a href="images.html">Obrázky</a>
      <a href="forms.html">Ukázky formulářů</a>
    </nav>
  </header>

  <main class="advanced-main">
    <h1>Rozšířené vyhledávání</h1>
    <section class="advanced-panel" aria-labelledby="find-pages-heading">
      <h2 id="find-pages-heading">Najít stránky obsahující…</h2>
      <form action="https://www.google.com/search" method="get">
        <label class="advanced-row" for="all-words">
          <span>všechna tato slova:</span>
          <input id="all-words" type="text" name="as_q">
        </label>
        <label class="advanced-row" for="exact-phrase">
          <span>přesné slovo nebo frázi:</span>
          <input id="exact-phrase" type="text" name="as_epq">
        </label>
        <label class="advanced-row" for="any-words">
          <span>alespoň jedno z těchto slov:</span>
          <input id="any-words" type="text" name="as_oq">
        </label>
        <label class="advanced-row" for="none-words">
          <span>žádné z těchto slov:</span>
          <input id="none-words" type="text" name="as_eq">
        </label>
        <div class="advanced-actions">
          <button class="advanced-button" type="submit">Rozšířené vyhledávání</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="home-footer">
    <nav aria-label="Validace a zdroje">
      <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fjakubkutlak.github.io%2Fgooglesearch%2Fadvanced.html"><img src="assets/html-validator.png" alt="Validovat HTML"></a>
      <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjakubkutlak.github.io%2Fgooglesearch%2Fstyles.css&amp;profile=css3&amp;usermedium=all&amp;warning=1"><img src="assets/css-validator.png" alt="Validovat CSS"></a>
      <a href="https://github.com/JakubKutlak/googlesearch/blob/main/citace.md">Citace a zdroje</a>
      <a href="https://jakubkutlak.github.io/">Portfolio ↗</a>
    </nav>
  </footer>
</body>
</html>
